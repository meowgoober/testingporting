    <script>
        function mergeFiles(fileParts, mimeType = "") {
            return new Promise((resolve, reject) => {
                let buffers = [];
                function fetchPart(index) {
                    if (index >= fileParts.length) {
                        let mergedBlob = new Blob(buffers, mimeType ? { type: mimeType } : {});
                        let mergedFileUrl = URL.createObjectURL(mergedBlob);
                        resolve(mergedFileUrl);
                        return;
                    }
                    fetch(fileParts[index])
                        .then((response) => response.arrayBuffer())
                        .then((data) => {
                            buffers.push(data);
                            fetchPart(index + 1);
                        }).catch(reject);
                }
                fetchPart(0);
            });
        }

        function getParts(file, start, end) {
            let parts = [];
            for (let i = start; i <= end; i++) {
                parts.push(file + ".part" + i);
            }
            return parts;
        }

        // Run both file mergers simultaneously (Adjust end numbers if you have a different amount of parts)
        Promise.all([
            mergeFiles(getParts("game.zip", 1, 13), "application/zip"),
            mergeFiles(getParts("renpy.wasm", 1, 2), "application/wasm")
        ]).then(async ([gameUrl, wasmUrl]) => {
            window.gameZipURL = gameUrl;

            // Configure Module so the engine loads our reassembled WASM blob URL instead of looking for a single file
            window.Module = window.Module || {};
            window.Module.locateFile = function(path) {
                if (path.endsWith("renpy.wasm")) {
                    return wasmUrl;
                }
                return path;
            };

            let cdnBase = "https://cdn.jsdelivr.net/gh/meowgoober/testingporting@5f4402562a72e215a9cc4aac8bb65ced1696a699/textyourlife/";
            
            let renpypre = document.createElement("script");
            renpypre.src = cdnBase + "renpy-pre.js";
            
            let renpy = document.createElement("script");
            renpy.src = cdnBase + "renpy.js";
            
            document.body.appendChild(renpypre);
            document.body.appendChild(renpy);
        }).catch(err => console.error("Error assembling files:", err));
    </script>
